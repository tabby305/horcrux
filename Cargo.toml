[package]
name = "horcrux"
version = "0.1.0"
edition = "2024"
description = "Offline Threshold Key Management System for Blockchain Private Keys"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
bincode = "1"
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
bs58 = "0.5"
clap = { version = "4.6", features = ["derive"] }
cosmrs = { version = "0.22", default-features = false }
ed25519-dalek = { version = "2.2", features = ["rand_core", "zeroize"] }
frost-ed25519 = "3.0.0"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
k256 = { version = "0.13", features = ["schnorr"] }
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
rpassword = "7"
rqrr = { version = "0.11.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solana-commitment-config = "3"
solana-hash = "3"
solana-message = { version = "3", features = ["bincode"] }
solana-pubkey = "3"
solana-rpc-client = "=3.0.7"
solana-signature = { version = "3", features = ["verify"] }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-transaction = { version = "3", features = ["bincode"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
vsss-rs = "5.4.0"
zeroize = "1.8"

[dev-dependencies]
serde_json = "1"
solana-rpc-client-api = "=3.0.7"
tempfile = "3"
